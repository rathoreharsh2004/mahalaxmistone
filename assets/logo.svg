<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" fill="none">
  <!-- Lotus Emblem -->
  <g transform="translate(190, 48)" stroke="#141c17" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Petal Nested -->
    <path d="M 0,0 C -3,-10 -4,-22 0,-32 C 4,-22 3,-10 0,0 Z" stroke-width="1.8"/>
    <path d="M 0,0 C -7,-12 -8,-26 0,-38 C 8,-26 7,-12 0,0 Z" stroke-width="1.8"/>
    <path d="M 0,0 C -12,-14 -13,-30 0,-44 C 13,-30 12,-14 0,0 Z" stroke-width="1.8"/>
    <!-- Inner Flanking Petals -->
    <path d="M -4,-2 C -15,-8 -22,-20 -18,-34 C -13,-24 -7,-14 -4,-2" stroke-width="1.8"/>
    <path d="M 4,-2 C 15,-8 22,-20 18,-34 C 13,-24 7,-14 4,-2" stroke-width="1.8"/>
    <!-- Outer Flanking Petals -->
    <path d="M -6,-2 C -24,-6 -34,-14 -30,-26 C -24,-18 -14,-10 -6,-2" stroke-width="1.8"/>
    <path d="M 6,-2 C 24,-6 34,-14 30,-26 C 24,-18 14,-10 6,-2" stroke-width="1.8"/>
    <!-- Bottom Cradle -->
    <path d="M -22,-4 C -12,4 12,4 22,-4" stroke-width="1.6"/>
  </g>

  <!-- Brand Wordmark: Mahalaxmi -->
  <text x="190" y="118" text-anchor="middle" font-family="'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif" font-weight="600" font-size="52" letter-spacing="-0.5" fill="#141c17">Mahalaxmi</text>

  <!-- Subtitle with Gold Flanking Accent Lines: — STONE — -->
  <g>
    <line x1="58" y1="147" x2="128" y2="147" stroke="#c5a059" stroke-width="2"/>
    <text x="190" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', 'DM Sans', -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="8" fill="#141c17">STONE</text>
    <line x1="252" y1="147" x2="322" y2="147" stroke="#c5a059" stroke-width="2"/>
  </g>
</svg>
